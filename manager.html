<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Manager - California Junction</title>
<style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#FFF8E8}header{padding:15px;background:#fff;border-bottom:4px solid #FF6B00;display:flex;align-items:center;gap:10px}header img{width:60px;height:60px;border-radius:50%;border:3px solid #0a2a4a}.tab{padding:10px 15px;background:#0a2a4a;color:#FFD700;border:none;border-radius:8px;margin:5px;cursor:pointer}.tab.active{background:#FF6B00;color:white}.box{background:white;border:2px solid #0a2a4a;border-radius:10px;padding:15px;margin:10px}</style>
</head><body>
<header><img src="logo.png"><div><h2 style="color:#0a2a4a">CALIFORNIA JUNCTION MANAGER</h2><p style="color:#E85D00;font-weight:bold">072 977 9153</p></div></header>
<div style="padding:10px"><button class="tab active" onclick="showTab('sales')">📊 Sales</button><button class="tab" onclick="showTab('stock')">📦 Stock</button><button class="tab" onclick="showTab('cashiers')">👥 Cashiers</button><a href="index.html" style="float:right;color:#0a2a4a">Customer Site</a> | <a href="pos.html" style="float:right;color:#0a2a4a;margin-right:10px">POS</a></div>
<div id="salesTab" class="box"><h3>Sales Report</h3><div id="salesList"></div><button onclick="clearSales()" style="background:#ef4444;color:white;padding:8px;border:none;border-radius:6px;margin-top:10px">Clear All Sales</button></div>
<div id="stockTab" class="box" style="display:none"><h3>Stock</h3><div id="stockList"></div></div>
<div id="cashiersTab" class="box" style="display:none"><h3>Cashiers</h3><div id="cashierList"></div><input id="newName" placeholder="Name" style="padding:8px;margin-top:10px"><input id="newPin" placeholder="PIN" style="padding:8px"><button onclick="addCashier()" style="padding:8px;background:#22c55e;color:white;border:none;border-radius:6px">Add Cashier</button></div>
<script>
let KOTAS=['r10','r20','r30','r40','r45','r55','r60','cheese','egg','atchar'];
function showTab(t){document.getElementById('salesTab').style.display=t=='sales'?'block':'none';document.getElementById('stockTab').style.display=t=='stock'?'block':'none';document.getElementById('cashiersTab').style.display=t=='cashiers'?'block':'none';render();}
function render(){let sales=JSON.parse(localStorage.getItem('cj_sales')||'[]');let html='';let total=0;sales.slice().reverse().forEach(s=>{total+=s.total;html+=`<div style="border-bottom:1px solid #ddd;padding:6px;font-size:12px"><b>${s.time}</b> - ${s.customer} (${s.cashier}) - ${s.items} - <b>R${s.total}</b></div>`});document.getElementById('salesList').innerHTML=html||'No sales yet'+`<h3 style="margin-top:10px">Total: R${total}</h3>`;let stock=JSON.parse(localStorage.getItem('cj_stock')||'{}');let sh='';KOTAS.forEach(id=>{sh+=`<div style="display:flex;justify-content:space-between;padding:5px;border-bottom:1px solid #eee"><span>${id}</span><span>${stock[id]!==undefined?stock[id]:100}</span></div>`});document.getElementById('stockList').innerHTML=sh;let cashiers=JSON.parse(localStorage.getItem('cj_cashiers')||'[{"name":"Kabelo","pin":"1234"},{"name":"Owner","pin":"0000"}]');let ch='';cashiers.forEach((c,i)=>{ch+=`<div style="display:flex;justify-content:space-between;padding:5px"><span>${c.name} - PIN: ${c.pin}</span><button onclick="delCashier(${i})" style="background:#ef4444;color:white;border:none;padding:4px 8px;border-radius:4px">Delete</button></div>`});document.getElementById('cashierList').innerHTML=ch;}
function clearSales(){if(confirm('Clear all sales?')){localStorage.removeItem('cj_sales');render();}}
function addCashier(){let n=document.getElementById('newName').value;let p=document.getElementById('newPin').value;if(!n||!p){alert('Enter name and PIN');return}let c=JSON.parse(localStorage.getItem('cj_cashiers')||'[]');c.push({name:n,pin:p});localStorage.setItem('cj_cashiers',JSON.stringify(c));document.getElementById('newName').value='';document.getElementById('newPin').value='';render();}
function delCashier(i){let c=JSON.parse(localStorage.getItem('cj_cashiers')||'[]');c.splice(i,1);localStorage.setItem('cj_cashiers',JSON.stringify(c));render();}
render();
</script>
</body></html>
