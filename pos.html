<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>California Junction POS - New Menu 2026</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}
body{background:#0f172a;color:white;padding:10px}
.header{background:linear-gradient(90deg,#FFD700,#FF6B00);color:#000;padding:12px;border-radius:12px;text-align:center;font-weight:bold;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.card{background:#1e293b;border-radius:12px;padding:10px;border-left:5px solid #FFD700}
.card h3{font-size:16px;color:#FFD700}
.card.desc{font-size:11px;color:#cbd5e1;margin:4px 0;height:32px}
.price-row{display:flex;justify-content:space-between;margin-top:6px}
.price{font-size:18px;font-weight:bold}
.stock{font-size:10px;background:#334155;padding:2px 6px;border-radius:10px}
button{flex:1;padding:8px;border:none;border-radius:8px;font-weight:bold;cursor:pointer}
.btn-add{background:#22c55e;color:white}
.btn-sub{background:#ef4444;color:white}
.btn-cart{background:#FFD700;color:black;width:100%;margin-top:6px}
.extra-section{margin-top:15px;background:#1e293b;padding:10px;border-radius:12px}
.extra-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.extra-card{background:#334155;padding:8px;border-radius:8px;text-align:center}
.cart{position:fixed;bottom:0;left:0;right:0;background:#020617;padding:12px;border-top:2px solid #FFD700;border-radius:15px 15px 0 0}
.total{font-size:18px;font-weight:bold;color:#FFD700;display:flex;justify-content:space-between;margin-top:8px;border-top:1px solid #334155;padding-top:6px}
.checkout{width:100%;background:#22c55e;color:white;padding:12px;border:none;border-radius:10px;font-size:16px;font-weight:bold;margin-top:8px}
</style>
</head>
<body>
<div class="header"><h1>CALIFORNIA JUNCTION</h1><p>NEW MENU 2026 - KASI STYLE</p></div>
<div class="grid" id="products"></div>
<div class="extra-section"><h3>🔥 EXTRAS</h3><div class="extra-grid" id="extras"></div></div>
<div style="height:180px"></div>
<div class="cart"><div id="cartList">Cart empty</div><div class="total"><span>TOTAL</span><span id="total">R0</span></div><button class="checkout" onclick="checkout()">✅ SELL</button></div>
<script>
const productsData=[
{id:'kota_r10',name:'KOTA R10',desc:'chips, atchar',price:10,stock:100,cls:'r10'},
{id:'kota_r20',name:'KOTA R20',desc:'chips, atchar, French and Vienna',price:20,stock:100,cls:'r20'},
{id:'kota_r30',name:'KOTA R30',desc:'chips, French and Russian OR cheese and Vienna',price:30,stock:100,cls:'r30'},
{id:'kota_r40',name:'KOTA R40',desc:'chips, atchar, French, cheese and Russian',price:40,stock:100,cls:'r40'},
{id:'kota_r45',name:'KOTA R45',desc:'chips, atchar, French, cheese, egg and beef Russian',price:45,stock:100,cls:'r45'},
{id:'kota_r55',name:'KOTA R55',desc:'chips, atchar, French, Russian, double Vienna',price:55,stock:100,cls:'r55'},
{id:'kota_r60',name:'KOTA R60',desc:'chips, atchar, French, cheese, egg, Russian and double Vienna',price:60,stock:100,cls:'r60'},
];
const extrasData=[
{id:'extra_cheese',name:'Extra Cheese',price:5,stock:100},
{id:'extra_egg',name:'Extra Egg',price:5,stock:100},
{id:'extra_atchar',name:'Extra Atchar',price:3,stock:100},
];
let cart=[];let stock=JSON.parse(localStorage.getItem('cj_stock')||'{}');
function getStock(id,def=100){return stock[id]!==undefined?stock[id]:def;}
function setStock(id,val){stock[id]=val;localStorage.setItem('cj_stock',JSON.stringify(stock));render();}
function render(){
const prodDiv=document.getElementById('products');prodDiv.innerHTML='';
productsData.forEach(p=>{
const s=getStock(p.id,p.stock);
prodDiv.innerHTML+=`<div class="card"><h3>${p.name}</h3><div class="desc">${p.desc}</div><div class="price-row"><span class="price">R${p.price}</span><span class="stock">${s} left</span></div><div style="display:flex;gap:5px;margin-top:6px"><button class="btn-sub" onclick="setStock('${p.id}',${s-1})">-</button><button class="btn-add" onclick="setStock('${p.id}',${s+1})">+ Stock</button></div><button class="btn-cart" onclick="addToCart('${p.id}',${p.price},'${p.name}')">Add to Sale</button></div>`;
});
const exDiv=document.getElementById('extras');exDiv.innerHTML='';
extrasData.forEach(p=>{
const s=getStock(p.id,p.stock);
exDiv.innerHTML+=`<div class="extra-card"><div style="font-weight:bold;font-size:12px">${p.name}</div><div style="color:#FFD700">+R${p.price}</div><div style="font-size:10px">${s} left</div><div style="display:flex;gap:3px;margin-top:4px"><button style="flex:1;background:#ef4444;color:white;border:none;border-radius:5px" onclick="setStock('${p.id}',${s-1})">-</button><button style="flex:1;background:#22c55e;color:white;border:none;border-radius:5px" onclick="setStock('${p.id}',${s+1})">+</button></div><button onclick="addToCart('${p.id}',${p.price},'${p.name}')" style="width:100%;margin-top:4px;background:#FFD700;border:none;border-radius:5px;padding:4px;font-size:10px;font-weight:bold">Add</button></div>`;
});
renderCart();
}
function addToCart(id,price,name){const s=getStock(id,100);if(s<=0){alert('Out of stock!');return;}cart.push({id,price,name});setStock(id,s-1);}
function renderCart(){const list=document.getElementById('cartList');if(cart.length===0){list.innerHTML='Cart empty';document.getElementById('total').innerText='R0';return;}let total=0;let html='';const counts={};cart.forEach(i=>{counts[i.name]=(counts[i.name]||0)+1;total+=i.price;});for(let k in counts){html+=`<div style="display:flex;justify-content:space-between;font-size:13px"><span>${k} x${counts[k]}</span><span>R${productsData.concat(extrasData).find(p=>p.name===k).price*counts[k]}</span></div>`;}list.innerHTML=html;document.getElementById('total').innerText='R'+total;}
function checkout(){if(cart.length===0)return;const total=cart.reduce((a,b)=>a+b.price,0);alert('SALE SUCCESS! R'+total);cart=[];render();}
render();
</script>
</body>
</html>
